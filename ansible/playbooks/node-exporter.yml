---
- name: Install Node Exporter on pi-control
  hosts: management
  become: true
  vars:
    node_exporter_version: "1.11.1"
    node_exporter_arch: "arm64"
    node_exporter_bin: /usr/local/bin/node_exporter
    node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"

  tasks:
    - name: Check if node_exporter is already installed at the right version
      shell: "{{ node_exporter_bin }} --version 2>&1 | grep -q '{{ node_exporter_version }}'"
      register: version_check
      changed_when: false
      failed_when: false

    - name: Download node_exporter tarball
      get_url:
        url: "{{ node_exporter_url }}"
        dest: /tmp/node_exporter.tar.gz
        mode: '0644'
      when: version_check.rc != 0

    - name: Extract node_exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: yes
      when: version_check.rc != 0

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: "{{ node_exporter_bin }}"
        mode: '0755'
        remote_src: yes
      when: version_check.rc != 0
      notify: restart node_exporter

    - name: Clean up temp files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/node_exporter.tar.gz
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
      when: version_check.rc != 0

    - name: Create node_exporter system user
      user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        home: /var/lib/node_exporter
        create_home: no

    - name: Create node_exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart={{ node_exporter_bin }} --web.listen-address=:9100
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: restart node_exporter

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Verify node_exporter is responding
      uri:
        url: http://localhost:9100/metrics
        status_code: 200
      register: health
      retries: 5
      delay: 3

    - name: Report status
      debug:
        msg: "node_exporter {{ node_exporter_version }} is running on pi-control:9100"

  handlers:
    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: yes
