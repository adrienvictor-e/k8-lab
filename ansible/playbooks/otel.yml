---
- name: Deploy OpenTelemetry Collector
  hosts: control_plane
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Add OpenTelemetry Helm repo
      shell: helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when:
        - repo_add.rc != 0
        - "'already exists' not in repo_add.stderr"

    - name: Update Helm repos
      shell: helm repo update
      changed_when: false

    - name: Install or upgrade OTel Collector
      shell: |
        helm upgrade --install otel-collector open-telemetry/opentelemetry-collector \
          --namespace monitoring \
          -f /home/adrien/homelab/k8s/logging/otel-values.yaml
      register: helm_result
      changed_when: "'has been upgraded' in helm_result.stdout or 'has been installed' in helm_result.stdout"

    - name: Show OTel install result
      debug:
        var: helm_result.stdout_lines
