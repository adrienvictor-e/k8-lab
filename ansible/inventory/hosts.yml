all:
  children:
    control_plane:
      hosts:
        pi-brain:
          ansible_host: 10.0.0.1
          ansible_user: adrien
          k3s_role: server
    workers:
      hosts:
        pi-body:
          ansible_host: 10.0.0.2
          ansible_user: adrien
          k3s_role: agent
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
