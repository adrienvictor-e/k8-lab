apiVersion: v1
kind: ConfigMap
metadata:
  name: webserver-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Adrien's Homelab</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }

        .header { padding: 60px 20px 40px; text-align: center; border-bottom: 1px solid #1a1a1a; }
        .header h1 { font-size: 2.2em; color: #fff; margin-bottom: 8px; }
        .header p { color: #888; font-size: 1.1em; }

        .status-bar { display: flex; justify-content: center; gap: 32px; padding: 20px; background: #0d0d0d; flex-wrap: wrap; border-bottom: 1px solid #1a1a1a; }
        .status-item { text-align: center; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #444; margin-right: 6px; transition: background 0.4s; }
        .status-dot.up { background: #22c55e; animation: pulse 2s infinite; }
        .status-dot.down { background: #ef4444; animation: none; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .status-label { font-size: 0.85em; color: #888; }
        .status-value { font-size: 1.1em; color: #fff; font-weight: 500; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 14px 20px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; flex-wrap: wrap; }
        .controls label { font-size: 0.85em; color: #888; }
        select#timerange { background: #161616; color: #e0e0e0; border: 1px solid #2e2e2e; border-radius: 6px; padding: 6px 12px; font-size: 0.9em; cursor: pointer; font-family: inherit; }
        .last-updated { font-size: 0.8em; color: #555; }

        .tabs-wrap { max-width: 1240px; margin: 28px auto 0; padding: 0 20px; }
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .tab-btn { background: #111; border: 1px solid #252525; border-radius: 8px; padding: 9px 22px; color: #666; font-size: 0.9em; cursor: pointer; transition: all 0.18s; font-family: inherit; }
        .tab-btn:hover { color: #ccc; border-color: #444; }
        .tab-btn.active { color: #60a5fa; border-color: #60a5fa; background: #0c1628; }

        .node-panel { display: none; max-width: 1240px; margin: 14px auto 0; padding: 0 20px 40px; }
        .node-panel.active { display: block; }

        .section-label { font-size: 0.72em; color: #60a5fa; text-transform: uppercase; letter-spacing: 2.5px; padding: 24px 0 10px; border-bottom: 1px solid #1a1a1a; margin-bottom: 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 4px; }
        .card { background: #0f0f0f; border: 1px solid #1e1e1e; border-radius: 12px; overflow: hidden; }
        .card-title { padding: 12px 16px 6px; font-size: 0.78em; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .card iframe { width: 100%; height: 240px; border: none; display: block; }
        .card iframe.gauge { height: 190px; }

        .no-data { background: #0f0f0f; border: 1px solid #1e1e1e; border-radius: 12px; padding: 36px 28px; text-align: center; color: #555; font-size: 0.9em; line-height: 1.9; margin-top: 20px; }
        .no-data strong { color: #888; display: block; margin-bottom: 6px; font-size: 1.05em; }
        .no-data a { color: #60a5fa; text-decoration: none; }
        .no-data a:hover { text-decoration: underline; }

        .arch { max-width: 1240px; margin: 0 auto; padding: 40px 20px 30px; }
        .arch h2 { font-size: 1.4em; margin-bottom: 16px; color: #fff; }
        .arch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .arch-item { background: #0f0f0f; border: 1px solid #1e1e1e; border-radius: 10px; padding: 20px; }
        .arch-item h3 { font-size: 1em; color: #60a5fa; margin-bottom: 6px; }
        .arch-item p { font-size: 0.85em; color: #888; line-height: 1.5; }

        .logs-section { max-width: 1240px; margin: 0 auto; padding: 0 20px 40px; }
        .logs-section h2 { font-size: 1.4em; margin-bottom: 6px; color: #fff; }
        .logs-section .subtitle { font-size: 0.85em; color: #555; margin-bottom: 20px; }
        .logs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .logs-card { background: #0f0f0f; border: 1px solid #1e1e1e; border-radius: 12px; padding: 22px; }
        .logs-card h3 { font-size: 0.95em; color: #60a5fa; margin-bottom: 6px; }
        .logs-card p { font-size: 0.82em; color: #666; line-height: 1.6; margin-bottom: 16px; }
        .logs-btn { display: inline-block; font-size: 0.8em; color: #60a5fa; border: 1px solid #1e4070; background: #0c1628; border-radius: 6px; padding: 6px 14px; text-decoration: none; transition: all 0.18s; }
        .logs-btn:hover { background: #122040; border-color: #60a5fa; }

        .footer { text-align: center; padding: 40px 20px; color: #444; font-size: 0.85em; border-top: 1px solid #1a1a1a; margin-top: 40px; }
        .footer a { color: #60a5fa; text-decoration: none; margin: 0 10px; }
        .footer a:hover { text-decoration: underline; }
      </style>
    </head>
    <body>

      <div class="header">
        <h1>Adrien's Kubernetes Homelab</h1>
        <p>Four Raspberry Pi 5s running K3s, monitored by Prometheus + Grafana, accessible worldwide via Cloudflare Tunnel</p>
      </div>

      <div class="status-bar">
        <div class="status-item">
          <span class="status-dot" id="dot-brain"></span><span class="status-value">pi-brain</span><br>
          <span class="status-label">Control Plane</span>
        </div>
        <div class="status-item">
          <span class="status-dot" id="dot-body"></span><span class="status-value">pi-body</span><br>
          <span class="status-label">Worker Node</span>
        </div>
        <div class="status-item">
          <span class="status-dot" id="dot-pi3"></span><span class="status-value">pi-3</span><br>
          <span class="status-label">Worker Node</span>
        </div>
        <div class="status-item">
          <span class="status-dot" id="dot-control"></span><span class="status-value">pi-control</span><br>
          <span class="status-label">DNS / Ansible</span>
        </div>
        <div class="status-item"><span class="status-value">K3s v1.34.4</span><br><span class="status-label">Kubernetes</span></div>
        <div class="status-item"><span class="status-value">Debian 13</span><br><span class="status-label">OS</span></div>
      </div>

      <div class="controls">
        <label for="timerange">Time range:</label>
        <select id="timerange" onchange="updateTimeRange(this.value)">
          <option value="now-1h">Last 1 hour</option>
          <option value="now-6h">Last 6 hours</option>
          <option value="now-24h">Last 24 hours</option>
          <option value="now-7d">Last 7 days</option>
        </select>
        <span class="last-updated" id="last-updated">—</span>
      </div>

      <div class="tabs-wrap">
        <div class="tabs">
          <button class="tab-btn active" onclick="showNode('brain', this)">pi-brain</button>
          <button class="tab-btn" onclick="showNode('body', this)">pi-body</button>
          <button class="tab-btn" onclick="showNode('pi3', this)">pi-3</button>
          <button class="tab-btn" onclick="showNode('control', this)">pi-control</button>
        </div>
      </div>

      <!-- pi-brain -->
      <div class="node-panel active" id="panel-brain">
        <div class="section-label">Memory</div>
        <div class="grid">
          <div class="card"><div class="card-title">Memory Gauge</div><iframe class="gauge" src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-6&theme=dark"></iframe></div>
          <div class="card"><div class="card-title">Memory Usage</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-5&theme=dark"></iframe></div>
        </div>
        <div class="section-label">CPU</div>
        <div class="grid">
          <div class="card"><div class="card-title">CPU Usage</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-2&theme=dark"></iframe></div>
        </div>
        <div class="section-label">Network</div>
        <div class="grid">
          <div class="card"><div class="card-title">Network Received</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-11&theme=dark"></iframe></div>
          <div class="card"><div class="card-title">Network Transmitted</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-12&theme=dark"></iframe></div>
        </div>
        <div class="section-label">Disk</div>
        <div class="grid">
          <div class="card"><div class="card-title">Disk I/O</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-8&theme=dark"></iframe></div>
        </div>
      </div>

      <!-- pi-body -->
      <div class="node-panel" id="panel-body">
        <div class="section-label">Memory</div>
        <div class="grid">
          <div class="card"><div class="card-title">Memory Gauge</div><iframe class="gauge" src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-6&theme=dark"></iframe></div>
          <div class="card"><div class="card-title">Memory Usage</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-5&theme=dark"></iframe></div>
        </div>
        <div class="section-label">CPU</div>
        <div class="grid">
          <div class="card"><div class="card-title">CPU Usage</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-2&theme=dark"></iframe></div>
        </div>
        <div class="section-label">Network</div>
        <div class="grid">
          <div class="card"><div class="card-title">Network Received</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-11&theme=dark"></iframe></div>
          <div class="card"><div class="card-title">Network Transmitted</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-12&theme=dark"></iframe></div>
        </div>
        <div class="section-label">Disk</div>
        <div class="grid">
          <div class="card"><div class="card-title">Disk I/O</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-8&theme=dark"></iframe></div>
        </div>
      </div>

      <!-- pi-3 -->
      <div class="node-panel" id="panel-pi3">
        <div class="section-label">Memory</div>
        <div class="grid">
          <div class="card"><div class="card-title">Memory Gauge</div><iframe class="gauge" src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.3:9100&refresh=30s&panelId=panel-6&theme=dark"></iframe></div>
          <div class="card"><div class="card-title">Memory Usage</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.3:9100&refresh=30s&panelId=panel-5&theme=dark"></iframe></div>
        </div>
        <div class="section-label">CPU</div>
        <div class="grid">
          <div class="card"><div class="card-title">CPU Usage</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.3:9100&refresh=30s&panelId=panel-2&theme=dark"></iframe></div>
        </div>
        <div class="section-label">Network</div>
        <div class="grid">
          <div class="card"><div class="card-title">Network Received</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.3:9100&refresh=30s&panelId=panel-11&theme=dark"></iframe></div>
          <div class="card"><div class="card-title">Network Transmitted</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.3:9100&refresh=30s&panelId=panel-12&theme=dark"></iframe></div>
        </div>
        <div class="section-label">Disk</div>
        <div class="grid">
          <div class="card"><div class="card-title">Disk I/O</div><iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.3:9100&refresh=30s&panelId=panel-8&theme=dark"></iframe></div>
        </div>
      </div>

      <!-- pi-control -->
      <div class="node-panel" id="panel-control">
        <div class="no-data">
          <strong>Node Exporter not installed on pi-control</strong>
          pi-control (10.0.0.4) runs Pi-hole DNS and Ansible — it is not a K3s worker node
          and does not have a Prometheus Node Exporter pod scheduled on it.<br><br>
          To enable metrics here, deploy Node Exporter on pi-control via Ansible and add
          it as a static scrape target in the Prometheus config.<br><br>
          <a href="https://github.com/adrienvictor-e/k8-lab" target="_blank">k8-lab repo</a>
        </div>
      </div>

      <div class="arch">
        <h2>Architecture</h2>
        <div class="arch-grid">
          <div class="arch-item">
            <h3>Hardware</h3>
            <p>4x Raspberry Pi 5 on Ethernet backbone &mdash; 1 control plane, 2 workers, 1 DNS/Ansible node</p>
          </div>
          <div class="arch-item">
            <h3>Orchestration</h3>
            <p>K3s lightweight Kubernetes, 1 control plane + 2 workers, Traefik ingress controller</p>
          </div>
          <div class="arch-item">
            <h3>Monitoring</h3>
            <p>Prometheus metrics, Grafana dashboards, Loki log aggregation, OTel Collector DaemonSet</p>
          </div>
          <div class="arch-item">
            <h3>Networking</h3>
            <p>Cloudflare Tunnel over HTTPS/443, Flannel CNI overlay, Pi-hole DNS on pi-control</p>
          </div>
          <div class="arch-item">
            <h3>Security</h3>
            <p>SSH key authentication, RBAC roles, Cloudflare SSL/TLS encryption end-to-end</p>
          </div>
          <div class="arch-item">
            <h3>Storage</h3>
            <p>Persistent Volumes via local-path-provisioner, ConfigMap-managed content</p>
          </div>
        </div>
      </div>

      <div class="logs-section">
        <h2>Cluster Logs</h2>
        <p class="subtitle">Logs shipped via OpenTelemetry Collector DaemonSet &rarr; Loki. Explore in Grafana by namespace or service.</p>
        <div class="logs-grid">
          <div class="logs-card">
            <h3>monitoring</h3>
            <p>Grafana, Prometheus, Loki, Alertmanager, OTel Collector</p>
            <a class="logs-btn" id="logs-monitoring" href="#" target="_blank">Explore in Grafana &nearr;</a>
          </div>
          <div class="logs-card">
            <h3>default</h3>
            <p>Application workloads &mdash; webserver, notes-app and other deployed services</p>
            <a class="logs-btn" id="logs-default" href="#" target="_blank">Explore in Grafana &nearr;</a>
          </div>
          <div class="logs-card">
            <h3>kube-system</h3>
            <p>K3s core components &mdash; CoreDNS, Traefik, metrics-server</p>
            <a class="logs-btn" id="logs-kubesystem" href="#" target="_blank">Explore in Grafana &nearr;</a>
          </div>
          <div class="logs-card">
            <h3>All Logs</h3>
            <p>Full log stream across all namespaces and services</p>
            <a class="logs-btn" id="logs-all" href="#" target="_blank">Explore in Grafana &nearr;</a>
          </div>
        </div>
      </div>

      <div class="footer">
        <p>
          Built by Adrien Esquerre &nbsp;|&nbsp;
          <a href="https://grafana.adrienesquerre.com" target="_blank">Full Grafana Dashboard</a>
          <a href="https://github.com/adrienvictor-e/k8-lab/tree/main/docs/postmortems" target="_blank">Incident Postmortems</a>
          <a href="https://github.com/adrienvictor-e/k8-lab" target="_blank">GitHub</a>
        </p>
      </div>

      <script>
        function showNode(id, btn) {
          document.querySelectorAll('.node-panel').forEach(function(p) { p.classList.remove('active'); });
          document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
          document.getElementById('panel-' + id).classList.add('active');
          btn.classList.add('active');
        }

        function updateTimeRange(from) {
          document.querySelectorAll('iframe').forEach(function(f) {
            f.src = f.src.replace(/from=now-[^&]+/, 'from=' + from);
          });
          updateTimestamp();
        }

        function updateTimestamp() {
          document.getElementById('last-updated').textContent =
            'Panels refresh every 30s &middot; Page loaded: ' + new Date().toLocaleTimeString();
        }

        setInterval(updateTimestamp, 30000);
        updateTimestamp();

        var nodes = [
          { id: 'brain',   instance: '10.0.0.1:9100' },
          { id: 'body',    instance: '10.0.0.2:9100' },
          { id: 'pi3',     instance: '10.0.0.3:9100' },
          { id: 'control', instance: '10.0.0.4:9100' }
        ];

        function setDot(id, state) {
          var dot = document.getElementById('dot-' + id);
          if (dot) { dot.classList.remove('up', 'down'); dot.classList.add(state); }
        }

        function checkHealth() {
          nodes.forEach(function(node) {
            var query = encodeURIComponent('up{instance="' + node.instance + '"}');
            fetch('/grafana-api/api/datasources/proxy/uid/prometheus/api/v1/query?query=' + query)
              .then(function(r) { return r.json(); })
              .then(function(data) {
                var result = data && data.data && data.data.result;
                var up = result && result.length > 0 && result[0].value && result[0].value[1] === '1';
                setDot(node.id, up ? 'up' : 'down');
              })
              .catch(function() { setDot(node.id, 'down'); });
          });
        }

        checkHealth();
        setInterval(checkHealth, 30000);

        // Build Grafana Explore URLs for Loki log links
        function lokiUrl(expr) {
          var state = JSON.stringify({
            datasource: 'P8E80F9AEF21F6940',
            queries: [{ expr: expr, refId: 'A' }],
            range: { from: 'now-1h', to: 'now' }
          });
          return 'https://grafana.adrienesquerre.com/explore?orgId=1&left=' + encodeURIComponent(state);
        }
        document.getElementById('logs-monitoring').href  = lokiUrl('{k8s_namespace_name="monitoring"}');
        document.getElementById('logs-default').href     = lokiUrl('{k8s_namespace_name="default"}');
        document.getElementById('logs-kubesystem').href  = lokiUrl('{k8s_namespace_name="kube-system"}');
        document.getElementById('logs-all').href         = lokiUrl('{k8s_namespace_name=~".+"}');
      </script>

    </body>
    </html>
  nginx.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }
      location /grafana-api/ {
        proxy_pass http://monitoring-grafana.monitoring.svc.cluster.local/;
        proxy_set_header Host grafana.adrienesquerre.com;
        proxy_set_header X-Real-IP $remote_addr;
      }
      location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
