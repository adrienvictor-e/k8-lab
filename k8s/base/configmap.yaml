apiVersion: v1
kind: ConfigMap
metadata:
  name: webserver-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Adrien's Homelab</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }
        .header { padding: 60px 20px 40px; text-align: center; border-bottom: 1px solid #222; }
        .header h1 { font-size: 2.2em; color: #fff; margin-bottom: 8px; }
        .header p { color: #888; font-size: 1.1em; }
        .status-bar { display: flex; justify-content: center; gap: 32px; padding: 20px; background: #111; flex-wrap: wrap; }
        .status-item { text-align: center; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .status-label { font-size: 0.85em; color: #888; }
        .status-value { font-size: 1.1em; color: #fff; font-weight: 500; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; padding: 30px 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #151515; border: 1px solid #222; border-radius: 12px; overflow: hidden; }
        .card-title { padding: 16px 20px 8px; font-size: 0.9em; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .card iframe { width: 100%; height: 200px; border: none; }
        .arch { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .arch h2 { font-size: 1.4em; margin-bottom: 16px; color: #fff; }
        .arch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .arch-item { background: #151515; border: 1px solid #222; border-radius: 10px; padding: 20px; }
        .arch-item h3 { font-size: 1em; color: #60a5fa; margin-bottom: 6px; }
        .arch-item p { font-size: 0.85em; color: #888; line-height: 1.5; }
        .footer { text-align: center; padding: 40px 20px; color: #444; font-size: 0.85em; border-top: 1px solid #222; margin-top: 40px; }
        .footer a { color: #60a5fa; text-decoration: none; }
      </style>
    </head>
    <body>
      <div class="header">
        <h1>Adrien's Kubernetes Homelab</h1>
        <p>Two Raspberry Pi 5s running K3s, monitored by Prometheus + Grafana, accessible worldwide via Cloudflare Tunnel</p>
      </div>
      <div class="status-bar">
        <div class="status-item"><span class="status-dot"></span><span class="status-value">pi-brain</span><br><span class="status-label">Control Plane</span></div>
        <div class="status-item"><span class="status-dot"></span><span class="status-value">pi-body</span><br><span class="status-label">Worker Node</span></div>
        <div class="status-item"><span class="status-value">K3s v1.34.4</span><br><span class="status-label">Kubernetes</span></div>
        <div class="status-item"><span class="status-value">Debian 13</span><br><span class="status-label">OS</span></div>
      </div>
      <div class="grid">
        <div class="card">
        <div class="card-title">Memory Gauge - pi-brain</div>
          <iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-6&theme=dark"></iframe>
        </div>
        <div class="card">
          <div class="card-title">Memory Gauge - pi-body</div>
          <iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-6&theme=dark"></iframe>
        </div>
        <div class="card">
          <div class="card-title">CPU Usage - pi-brain</div>
          <iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-2&theme=dark"></iframe>
        </div>
        <div class="card">
          <div class="card-title">CPU Usage - pi-body</div>
          <iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-2&theme=dark"></iframe>
        </div>
        <div class="card">
          <div class="card-title">Memory Usage - pi-brain</div>
          <iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.1:9100&refresh=30s&panelId=panel-5&theme=dark"></iframe>
        </div>
        <div class="card">
          <div class="card-title">Memory Usage - pi-body</div>
          <iframe src="https://grafana.adrienesquerre.com/d-solo/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?orgId=1&from=now-1h&to=now&timezone=utc&var-datasource=prometheus&var-instance=10.0.0.2:9100&refresh=30s&panelId=panel-5&theme=dark"></iframe>
        </div>
      </div>
      <div class="arch">
        <h2>Architecture</h2>
        <div class="arch-grid">
          <div class="arch-item">
            <h3>Hardware</h3>
            <p>2x Raspberry Pi 5 (8GB RAM), cluster rack with active cooling, direct Ethernet link between nodes</p>
          </div>
          <div class="arch-item">
            <h3>Orchestration</h3>
            <p>K3s lightweight Kubernetes, 1 control plane + 1 worker, Traefik ingress controller</p>
          </div>
          <div class="arch-item">
            <h3>Monitoring</h3>
            <p>Prometheus metrics collection, Grafana dashboards, Node Exporter for hardware telemetry</p>
          </div>
          <div class="arch-item">
            <h3>Networking</h3>
            <p>Cloudflare Tunnel over HTTPS/443, Flannel CNI overlay, mDNS for local access</p>
          </div>
          <div class="arch-item">
            <h3>Security</h3>
            <p>SSH key authentication, RBAC roles, Cloudflare SSL/TLS encryption end-to-end</p>
          </div>
          <div class="arch-item">
            <h3>Storage</h3>
            <p>Persistent Volumes via local-path-provisioner, ConfigMap-managed content</p>
          </div>
        </div>
      </div>
      <div class="footer">
        <p>Built by Adrien Esquerre | <a href="https://grafana.adrienesquerre.com" target="_blank">Full Grafana Dashboard</a></p>
      </div>
    </body>
    </html>
  nginx.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }
      location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
