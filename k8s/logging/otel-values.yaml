mode: daemonset

presets:
  logsCollection:
    enabled: true

config:
  exporters:
    loki:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  service:
    pipelines:
      logs:
        exporters:
          - loki

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128M
